<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0d1117;font-family:Arial,sans-serif;line-height:1.5;}

/* PREVENT iOS ZOOM — all inputs exactly 16px */
input,select,textarea{font-size:16px!important;-webkit-appearance:none;appearance:none;}

/* RESPONSIVE CONTAINER */
.wrap{max-width:600px;width:100%;margin:0 auto;box-sizing:border-box;}

/* ROW 1 — 标题 */
.row1{
  background:rgb(13,17,23);color:#fff;
  font-family:Arial;font-size:16px;font-weight:bold;
  padding:14px 20px;text-align:center;letter-spacing:.5px;
}

/* ROW 2 — 副标题 */
.row2{
  background:rgb(13,17,23);color:#fff;
  font-family:Arial;font-size:14px;
  padding:6px 20px 12px;text-align:center;line-height:1.6;
}

/* 左右两组面板并排（手机与电脑都维持左右两栏，不堆叠） */
.panels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
}

/* PARAM ROWS（缩窄间距版） */
.param-row{
  display:grid;grid-template-columns:1fr 1fr;
  min-height:40px;border-bottom:1px solid #0d1117;
}
.param-label{
  background:rgb(13,17,23);
  color:rgb(0,200,150);
  font-family:Arial;font-size:14px;
  display:flex;align-items:center;
  padding:8px 12px;border-right:1px solid #0d1117;
  line-height:1.4;
}
.param-label.orange{color:rgb(245,166,35);}

/* 左右面板标题（方便手机上快速判断左右区块） */
.panel-title{
  background:rgb(13,17,23);
  color:rgb(139,148,158);
  font-family:Arial;font-size:13px;font-weight:bold;
  text-align:center;
  padding:8px 6px;
  border-bottom:1px solid #0d1117;
  letter-spacing:.3px;
}

.param-value{
  background:rgb(13,17,23);
  display:flex;align-items:center;justify-content:center;
  padding:4px 6px;
}

/* INPUT — 无下拉选单，聚焦时高亮 */
.param-input{
  width:100%;
  background:rgb(28,40,64);
  border:1.5px solid rgba(0,229,204,0.2);
  border-radius:6px;
  color:rgb(0,229,204);
  font-family:Arial;font-size:16px;
  padding:8px 8px;
  text-align:center;
  outline:none;
  -moz-appearance:textfield;
}
.param-input::-webkit-outer-spin-button,
.param-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.param-input:focus{
  border-color:rgb(0,229,204);
  background:rgba(0,229,204,0.1);
  box-shadow:0 0 0 2px rgba(0,229,204,0.15);
}

/* COMPUTED — 橘色粗体（B5 / D8 / D9） */
.computed{
  color:rgb(245,166,35);font-family:Arial;font-size:16px;font-weight:bold;
}

/* BUTTON ROW */
.btn-row{
  background:rgb(13,17,23);
  display:flex;gap:10px;
  padding:12px 16px;
  border-bottom:1px solid #0d1117;
}
.btn{
  flex:1;
  background:rgb(13,17,23);
  border:1.5px solid rgb(0,229,204);
  color:rgb(0,229,204);
  font-family:Arial;font-size:14px;
  padding:14px 10px;
  border-radius:6px;cursor:pointer;
  text-align:center;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
  min-height:48px;
}
.btn:active{background:rgba(0,229,204,0.15);}

/* 报表表头（sticky） */
.tbl-header{
  display:grid;grid-template-columns:1fr 1.4fr 1fr 1fr;
  background:rgb(0,184,122);
  position:sticky;top:0;z-index:10;
}
.th{
  color:#000;font-family:Arial;font-size:12px;font-weight:bold;
  padding:9px 4px;text-align:center;
  border-right:1px solid rgba(0,0,0,.1);
}
.th:last-child{border-right:none;}

/* TABLE */
.tbl-scroll{overflow-y:auto;max-height:56vh;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-family:Arial;font-size:12px;table-layout:fixed;}
td{text-align:center;padding:5px 3px;border-bottom:1px solid rgba(0,0,0,.2);}

tr.row-odd  td{background:rgb(26,35,50); color:rgb(170,200,255);}
tr.row-even td{background:rgb(17,24,39); color:rgb(170,200,255);}
tr.open-row td{background:rgb(159,197,232)!important;color:#000!important;font-weight:bold;}

/* 手机窄屏（≤480px）：维持左右两栏并排，改用更紧凑的字级与内距 */
@media(max-width:480px){
  .row1{font-size:14px;padding:12px 10px;}
  .row2{font-size:12px;padding:4px 10px 10px;}

  .panel-title{font-size:10px;padding:6px 4px;}
  .param-row{min-height:34px;}
  .param-label{font-size:11px;padding:4px 5px;line-height:1.25;}
  .param-value{padding:3px 3px;}
  .param-input{padding:6px 3px;font-size:16px;} /* 保持16px防止iOS放大 */
  .computed{font-size:13px;}

  .btn{font-size:11px;padding:10px 4px;min-height:40px;}
  .btn-row{padding:10px 8px;gap:6px;}

  .th{font-size:9px;padding:7px 2px;}
  table{font-size:10px;}
  td{padding:4px 2px;}
}

@media(max-width:360px){
  .panel-title{font-size:9px;padding:5px 3px;}
  .param-label{font-size:10px;padding:3px 4px;}
  .param-input{padding:5px 2px;}
  .computed{font-size:12px;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="row1">仓位管理：以损定仓</div>
  <div class="row2">什么叫以损定仓？就是用你能接受的损失金额，来计算你的开仓大小和杠杆倍数。</div>

  <div class="panels">

    <!-- ================= 左侧：B 栏 ================= -->
    <div class="panel-left">

      <div class="panel-title">左侧计算：反推开仓保证金</div>

      <div class="param-row">
        <div class="param-label">承受总资金停损多少趴</div>
        <div class="param-value">
          <input class="param-input" id="B3" type="number" inputmode="decimal" value="100">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">总资金 (U)</div>
        <div class="param-value">
          <input class="param-input" id="B4" type="number" inputmode="decimal" value="60">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label orange">开仓保证金 (u)</div>
        <div class="param-value">
          <span class="computed" id="B5">—</span>
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">杠杆倍数 (x)</div>
        <div class="param-value">
          <input class="param-input" id="B6" type="number" inputmode="decimal" value="20">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">开仓均价</div>
        <div class="param-value">
          <input class="param-input" id="B7" type="number" inputmode="decimal" value="3000">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">止损设定</div>
        <div class="param-value">
          <input class="param-input" id="B8" type="number" inputmode="decimal" value="2900">
        </div>
      </div>

    </div>

    <!-- ================= 右侧：D 栏 ================= -->
    <div class="panel-right">

      <div class="panel-title">右侧计算：反推止损点位</div>

      <div class="param-row">
        <div class="param-label">承受总资金停损多少趴</div>
        <div class="param-value">
          <input class="param-input" id="D3" type="number" inputmode="decimal" value="100">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">总资金 (U)</div>
        <div class="param-value">
          <input class="param-input" id="D4" type="number" inputmode="decimal" value="60">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">开仓保证金 (u)</div>
        <div class="param-value">
          <input class="param-input" id="D5" type="number" inputmode="decimal" value="60">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">杠杆倍数 (x)</div>
        <div class="param-value">
          <input class="param-input" id="D6" type="number" inputmode="decimal" value="20">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label">开仓均价</div>
        <div class="param-value">
          <input class="param-input" id="D7" type="number" inputmode="decimal" value="3000">
        </div>
      </div>

      <div class="param-row">
        <div class="param-label orange">多头止损设定价</div>
        <div class="param-value">
          <span class="computed" id="D8">—</span>
        </div>
      </div>

      <div class="param-row">
        <div class="param-label orange">空头止损设定价</div>
        <div class="param-value">
          <span class="computed" id="D9">—</span>
        </div>
      </div>

    </div>

  </div>

  <!-- 按钮 -->
  <div class="btn-row">
    <button class="btn" onclick="scrollToOpen()">⊙ 跳到保本点</button>
    <button class="btn" onclick="resetDefaults()">↺ 重置预设值</button>
  </div>

  <!-- 报表表头 -->
  <div class="tbl-header">
    <div class="th">涨跌幅</div>
    <div class="th">目标价格</div>
    <div class="th">该笔损益</div>
    <div class="th">占总资金</div>
  </div>

  <div class="tbl-scroll">
    <table><tbody id="tbody"></tbody></table>
  </div>

</div>

<script>
(function(){
"use strict";

function g(id){ return parseFloat(document.getElementById(id).value) || 0; }

// ---------- B5 计算 ----------
// B5 = MIN(B4, IF(OR(B7=0, B8=B7), 0, (B4*(B3/100)) / ((ABS(B8-B7)/B7) * B6)))
function calcB5(){
  var B3=g('B3'), B4=g('B4'), B6=g('B6'), B7=g('B7'), B8=g('B8');
  var result;
  if(B7===0 || B8===B7 || B6===0){
    result = 0;
  } else {
    result = (B4*(B3/100)) / ((Math.abs(B8-B7)/B7) * B6);
  }
  result = Math.min(B4, result);
  if(!isFinite(result) || result < 0) result = 0;
  return result;
}

// ---------- D8 / D9 计算 ----------
function calcD89(){
  var D3=g('D3'), D4=g('D4'), D5=g('D5'), D6=g('D6'), D7=g('D7');
  var d8, d9;
  if(D5===0 || D6===0){
    d8 = 0; d9 = 0;
  } else {
    var delta = (D4*(D3/100)*D7)/(D5*D6);
    d8 = Math.max(0, D7 - delta);
    d9 = Math.max(0, D7 + delta);
  }
  if(!isFinite(d8)) d8 = 0;
  if(!isFinite(d9)) d9 = 0;
  return {d8:d8, d9:d9};
}

// ---------- 报表 ----------
// 该笔损益 = ABS(B4-(ROW()-11))  i = ROW()-11, i = 0..2N
// 占总资金 = C / B4
// 目标价格 = B7 + ((B4 - i) * B7) / (B5 * B6)
// 涨跌幅   = (目标价格 - B7) / B7
function render(){
  var B4=g('B4'), B6=g('B6'), B7=g('B7'), B5=calcB5();
  var tb = document.getElementById('tbody');
  tb.innerHTML = '';

  var N = Math.round(B4);
  if(N < 0) N = 0;
  if(N > 5000) N = 5000;

  var frag = document.createDocumentFragment();
  var openIndex = N;

  for(var i=0; i<=2*N; i++){
    var C = Math.abs(B4 - i);
    var D = B4 !== 0 ? (C / B4) : 0;

    var price;
    if(B5 === 0 || B6 === 0){
      price = B7;
    } else {
      price = B7 + ((B4 - i) * B7) / (B5 * B6);
    }
    if(!isFinite(price)) price = B7;

    var A = B7 !== 0 ? (price - B7) / B7 : 0;

    var tr = document.createElement('tr');
    if(i === openIndex){
      tr.className = 'open-row';
      tr.id = 'open-row';
    } else {
      tr.className = (i % 2 === 0) ? 'row-odd' : 'row-even';
    }

    tr.innerHTML =
      '<td>'+(A*100).toFixed(2)+'%</td>'+
      '<td>'+price.toFixed(4)+'</td>'+
      '<td>'+C.toFixed(2)+'</td>'+
      '<td>'+(D*100).toFixed(2)+'%</td>';

    frag.appendChild(tr);
  }
  tb.appendChild(frag);
}

function update(){
  var b5 = calcB5();
  document.getElementById('B5').textContent = b5.toFixed(2);

  var d = calcD89();
  document.getElementById('D8').textContent = d.d8.toFixed(4);
  document.getElementById('D9').textContent = d.d9.toFixed(4);

  render();
}

window.scrollToOpen = function(){
  var r = document.getElementById('open-row');
  if(r) r.scrollIntoView({block:'center', behavior:'smooth'});
};

window.resetDefaults = function(){
  document.getElementById('B3').value = 100;
  document.getElementById('B4').value = 60;
  document.getElementById('B6').value = 20;
  document.getElementById('B7').value = 3000;
  document.getElementById('B8').value = 2900;

  document.getElementById('D3').value = 100;
  document.getElementById('D4').value = 60;
  document.getElementById('D5').value = 60;
  document.getElementById('D6').value = 20;
  document.getElementById('D7').value = 3000;

  update();
  setTimeout(scrollToOpen, 80);
};

document.querySelectorAll('.param-input').forEach(function(el){
  el.addEventListener('input', update);
});

update();
setTimeout(scrollToOpen, 120);

// ---------- Service Worker（离线支持）----------
if("serviceWorker" in navigator){
  try{
    var swCode = "self.addEventListener('fetch', function(e){});";
    var blob = new Blob([swCode], {type:"application/javascript"});
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(function(){});
  }catch(e){}
}
})();
</script>

</body>
</html>
